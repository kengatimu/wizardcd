logging:
  file:
    path: /opt/wizardcd/logs
  level:
    ROOT: INFO
    com.ebb.wizardcd.runner: INFO

server:
  port: 8081

runner:
  scriptsDir: /opt/wizardcd/runner
  workspaceRoot: /opt/wizardcd/workspace/jobs
  executionTimeoutMinutes: 30
  maxConcurrentJobs: 1

wizardcd:
  cors:
    allowed-origins:
      - http://localhost:5173
