<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WizardCD — Letterhead</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --navy:       #0D2240;
      --crimson:    #8B1A1A;
      --crimson-dk: #D44040;
      --cream:      #F8F6F1;
      --stone:      #EAE6DF;
      --white:      #FFFFFF;
      --muted:      #666666;
    }

    body {
      background: #D0CFCC;
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    @media print {
      @page { size: A4 portrait; margin: 0; }
      body  { background: none; }
      .page { margin: 0; box-shadow: none; }
    }

    /* ── A4 page ── */
    .page {
      width: 794px;
      min-height: 1123px;
      background: var(--white);
      margin: 32px auto;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 48px rgba(0,0,0,.18);
    }

    /* ══════════════════════════════════════════
       HEADER — light, logo left, tagline right
       (mirrors EBB letterhead structure)
    ══════════════════════════════════════════ */
    .lh-header {
      padding: 44px 64px 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    /* WizardCD wordmark — light variant */
    .lh-wordmark {
      font-family: 'Libre Baskerville', serif;
      font-weight: 700;
      font-size: 52px;
      color: var(--navy);
      letter-spacing: .01em;
      line-height: 1;
    }
    .lh-wordmark em {
      color: var(--crimson);
      font-style: normal;
    }

    /* Tagline — bottom-right, baseline-aligned with logo */
    .lh-tagline {
      font-family: 'Libre Baskerville', serif;
      font-style: italic;
      font-size: 13px;
      color: var(--navy);
      letter-spacing: .05em;
      text-align: right;
      line-height: 1.55;
    }

    /* ── Crimson divider ── */
    .lh-divider {
      margin: 20px 64px 0;
      height: 1px;
      background: var(--crimson);
    }

    /* ══════════════════════════════════════════
       BODY — blank writing area
    ══════════════════════════════════════════ */
    .lh-body {
      flex: 1;
      padding: 52px 64px 0;
    }

    /* ══════════════════════════════════════════
       FOOTER — navy, dark wordmark
    ══════════════════════════════════════════ */
    .lh-footer {
      background: var(--navy);
      padding: 18px 64px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* WizardCD wordmark — dark variant */
    .lhf-brand {
      font-family: 'Libre Baskerville', serif;
      font-weight: 700;
      font-size: 15px;
      color: var(--white);
      letter-spacing: .01em;
      line-height: 1;
    }
    .lhf-brand em { color: var(--crimson-dk); font-style: normal; }

    /* Contact + attribution stack */
    .lhf-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
    }
    .lhf-contact {
      display: flex;
      align-items: center;
    }
    .lhf-item {
      font-family: 'Inter', sans-serif;
      font-size: 8.5px;
      color: rgba(255,255,255,.5);
      letter-spacing: .06em;
    }
    .lhf-item a {
      color: rgba(255,255,255,.7);
      text-decoration: none;
    }
    .lhf-item a:hover { color: var(--crimson-dk); }
    .lhf-sep { margin: 0 8px; color: var(--crimson-dk); font-size: 7px; opacity: .55; }

    .lhf-powered {
      font-family: 'Inter', sans-serif;
      font-size: 7.5px;
      color: rgba(255,255,255,.22);
      letter-spacing: .09em;
      text-transform: uppercase;
    }

    /* ── Bottom crimson bar ── */
    .lh-bottom { width: 100%; height: 4px; background: var(--crimson); flex-shrink: 0; }
  </style>
</head>
<body>

<div class="page">

  <!-- Header: light — wordmark left, tagline right (EBB letterhead pattern) -->
  <div class="lh-header">
    <div class="lh-wordmark">Wizard<em>CD</em></div>
    <div class="lh-tagline">One Config. One Command.<br/>Continuous Magic.</div>
  </div>

  <!-- Crimson divider -->
  <div class="lh-divider"></div>

  <!-- Blank writing area -->
  <div class="lh-body"></div>

  <!-- Footer: navy — dark wordmark left, contact right -->
  <div class="lh-footer">
    <div class="lhf-brand">Wizard<em>CD</em></div>
    <div class="lhf-right">
      <div class="lhf-contact">
        <span class="lhf-item"><a href="https://www.wizardcd.com">www.wizardcd.com</a></span>
        <span class="lhf-sep">·</span>
        <span class="lhf-item"><a href="mailto:info@engineeredbybytes.com">info@engineeredbybytes.com</a></span>
      </div>
      <div class="lhf-powered">Powered by Engineered by Bytes Ltd · Nairobi, Kenya</div>
    </div>
  </div>
  <div class="lh-bottom"></div>

</div>

</body>
</html>
