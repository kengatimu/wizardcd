<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <!-- Apply light-mode class synchronously before first paint to prevent flash of wrong theme -->
    <script>try{if(localStorage.getItem('wiz-theme')==='light'){document.documentElement.classList.add('light');document.documentElement.setAttribute('data-theme','light');}}catch(e){}</script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="WizardCD — Config-driven deployment automation platform" />
    <link rel="icon" type="image/png" href="/wizardCD-logo.png" />
    <title>WizardCD — Control Plane</title>

    <!-- Google Fonts: Inter + JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
