# ============================================================
# Azure Pipeline for WizardCD CI/CD (v2.2)
# ============================================================
# Auto-generated by WizardCD from deployment-config.yml
#   App: #{APP_NAME}#
#   Env: #{ENVIRONMENT}#
#   Repo: #{REPO_URL}#
#
# NOTE:
#   This file is generated automatically. Manual edits will be
#   overwritten on the next `wizard apply --target azure`.
# ============================================================

trigger: none
pr: none

# ------------------------------------------------------------
# Pipeline agent pool
# ------------------------------------------------------------
pool:
  vmImage: "ubuntu-latest"

stages:
  - stage: Build
    displayName: "WizardCD Dynamic Build + Package"
    jobs:
      - job: BuildAndPackage
        displayName: "Build and Package (Dynamic from WizardCD Config)"
        steps:

          # ------------------------------------------------------------
          # Step 0: Ensure yq is available (portable, non-root)
          # ------------------------------------------------------------
          - script: |
              echo "[Step 0] Checking for yq binary..."
              if ! command -v yq >/dev/null 2>&1; then
                echo "[INFO] yq not found. Installing locally..."
                mkdir -p $(Pipeline.Workspace)/tools
                curl -L "https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64" \
                  -o $(Pipeline.Workspace)/tools/yq
                chmod +x $(Pipeline.Workspace)/tools/yq
                echo "##vso[task.setvariable variable=YQ_PATH]$(Pipeline.Workspace)/tools/yq"
                echo "##vso[task.prependpath]$(Pipeline.Workspace)/tools"
              else
                echo "[INFO] yq already available at $(which yq)"
                echo "##vso[task.setvariable variable=YQ_PATH]$(which yq)"
              fi
              $(YQ_PATH) --version || true
            displayName: "Ensure yq Installed (Portable)"

          # ------------------------------------------------------------
          # Step 1: Load config variables from WizardCD (static replace)
          # ------------------------------------------------------------
          - script: |
              echo "[Step 1] Setting WizardCD build variables..."
              APP_NAME=#{APP_NAME}#
              ENVIRONMENT=#{ENVIRONMENT}#
              JAVA_VERSION=#{JAVA_VERSION}#
              KEYVAULT_NAME=#{KEYVAULT_NAME}#
              ARTIFACT_NAME=#{ARTIFACT_NAME}#
              PROJECT_BASE_PATH=#{PROJECT_BASE_PATH}#
              REPO_URL=#{REPO_URL}#

              echo "##vso[task.setvariable variable=APP_NAME]$APP_NAME"
              echo "##vso[task.setvariable variable=ENVIRONMENT]$ENVIRONMENT"
              echo "##vso[task.setvariable variable=JAVA_VERSION]$JAVA_VERSION"
              echo "##vso[task.setvariable variable=KEYVAULT_NAME]$KEYVAULT_NAME"
              echo "##vso[task.setvariable variable=ARTIFACT_NAME]$ARTIFACT_NAME"
              echo "##vso[task.setvariable variable=PROJECT_BASE_PATH]$PROJECT_BASE_PATH"
              echo "##vso[task.setvariable variable=REPO_URL]$REPO_URL"
              echo "[INFO] Repo: $REPO_URL"
            displayName: "Load WizardCD Config Variables"

          # ------------------------------------------------------------
          # Step 2: Connect to Azure KeyVault
          # ------------------------------------------------------------
          - task: AzureKeyVault@2
            displayName: "Connect To Azure KeyVault"
            inputs:
              azureSubscription: "Enterprise Core"
              KeyVaultName: "$(KEYVAULT_NAME)"
              SecretsFilter: "*"
              RunAsPreJob: false
            condition: and(succeeded(), ne(variables['KEYVAULT_NAME'], ''))

          # ------------------------------------------------------------
          # Step 3: Token replacement using KeyVault secrets
          # ------------------------------------------------------------
          - task: replacetokens@5
            displayName: "Replace Tokens Using KeyVault Secrets"
            inputs:
              folderPath: "$(System.DefaultWorkingDirectory)"
              targetFiles: "pipelines/java_env/$(ENVIRONMENT)/*.sh"
              tokenPrefix: "#{"
              tokenSuffix: "}#"

          # ------------------------------------------------------------
          # Step 4: Install required Java version dynamically
          # ------------------------------------------------------------
          - script: |
              echo "[Step 4] Installing Temurin JDK $(JAVA_VERSION)..."
              JDK_DIR="$(Pipeline.Workspace)/jdk-temurin-$(JAVA_VERSION)"
              if [ ! -d "$JDK_DIR" ]; then
                echo "[INFO] Downloading JDK..."
                mkdir -p "$JDK_DIR"
                curl -L "https://github.com/adoptium/temurin$(JAVA_VERSION)-binaries/releases/latest/download/OpenJDK$(JAVA_VERSION)U-jdk_x64_linux_hotspot.tar.gz" \
                  -o jdk.tar.gz
                tar -xzf jdk.tar.gz -C "$JDK_DIR" --strip-components=1
              fi
              "$JDK_DIR/bin/java" -version
              echo "##vso[task.setvariable variable=JDK_DIR]$JDK_DIR"
            displayName: "Install Java Dynamically (No Root)"

          # ------------------------------------------------------------
          # Step 5: Maven build
          # ------------------------------------------------------------
          - task: Maven@4
            displayName: "Maven Clean Install"
            inputs:
              mavenPomFile: "pom.xml"
              options: "-Dspring.profiles.active=$(ENVIRONMENT) -DskipTests"
              javaHomeOption: "Path"
              jdkDirectory: "$(JDK_DIR)"
              goals: "clean install"

          # ------------------------------------------------------------
          # Step 5.5: Sync build output with WizardCD
          # ------------------------------------------------------------
          - script: |
              echo "[Step 5.5] Syncing Maven build output..."
              mkdir -p #{PROJECT_BASE_PATH}#/target
              cp target/#{APP_NAME}#-0.0.1-SNAPSHOT.jar #{PROJECT_BASE_PATH}#/target/
              ls -lh #{PROJECT_BASE_PATH}#/target/ || true
            displayName: "Sync Maven Output with WizardCD"

          # ------------------------------------------------------------
          # Step 6: Update config path (WizardCD auto-update)
          # ------------------------------------------------------------
          - script: |
              echo "[Step 6] Updating project_base_path in WizardCD config..."
              $(YQ_PATH) -i ".apps.\"$(APP_NAME)\".\"$(ENVIRONMENT)\".project_base_path = \"$(System.DefaultWorkingDirectory)\"" wizardcd/config/deployment-config.yml
              grep project_base_path wizardcd/config/deployment-config.yml
            displayName: "Update Config project_base_path"

          # ------------------------------------------------------------
          # Step 7: Run WizardCD packaging
          # ------------------------------------------------------------
          - task: Bash@3
            displayName: "Run WizardCD Packaging"
            inputs:
              targetType: "inline"
              script: |
                chmod +x wizardcd/bin/core/package-artifacts.sh
                wizardcd/bin/core/package-artifacts.sh "$(APP_NAME)" "$(ENVIRONMENT)"
                echo "[Step] Packaging complete."
                ls -lh build/packages || true

          # ------------------------------------------------------------
          # Step 8: Publish build artifacts
          # ------------------------------------------------------------
          - task: PublishBuildArtifacts@1
            displayName: "Publish WizardCD Artifact"
            inputs:
              PathtoPublish: "build/packages"
              ArtifactName: "$(ARTIFACT_NAME)"
              publishLocation: "Container"
